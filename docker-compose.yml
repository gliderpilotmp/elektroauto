# Startet die App z.B. auf einer Synology (Container Manager → Projekt)
# oder überall mit: docker compose up -d --build
services:
  elektroauto:
    build: .
    container_name: elektroauto
    env_file: .env
    environment:
      - TZ=Europe/Vienna
      - DATA_DIR=/data
    volumes:
      # Verlauf, Benachrichtigungs-Einstellungen und Push-Schlüssel
      - ./data:/data
    ports:
      - "8765:8000"
    restart: unless-stopped
