<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 333">
  <!-- Schlichte, eigene Kleinwagen-Silhouette als Platzhalter.
       Eigenes Foto: data/car.webp (oder .png/.jpg) auf dem Server ablegen. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8fb8"/>
      <stop offset=".55" stop-color="#2d5878"/>
      <stop offset="1" stop-color="#1b3850"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe6f5" stop-opacity=".9"/>
      <stop offset="1" stop-color="#6d93ad" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="rim" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d9dee3"/>
      <stop offset=".7" stop-color="#9aa3ab"/>
      <stop offset="1" stop-color="#6b737a"/>
    </radialGradient>
  </defs>
  <!-- Karosserie -->
  <path d="M62 236c-8 0-14-6-14-14v-30c0-16 8-26 24-31l58-18c26-44 66-74 132-78 64-4 118 12 160 52l18 18c34 4 62 12 84 26 16 10 24 24 24 40v21c0 8-6 14-14 14z" fill="url(#body)"/>
  <!-- Fenster -->
  <path d="M160 150c22-36 56-58 108-60v62z" fill="url(#glass)"/>
  <path d="M282 90c46 0 86 14 118 44l16 18H282z" fill="url(#glass)"/>
  <!-- Linien -->
  <path d="M272 92v150M420 156c0 30-4 60-10 86" fill="none" stroke="#14293a" stroke-width="3" opacity=".6"/>
  <path d="M300 176h26" stroke="#9fc0d8" stroke-width="5" stroke-linecap="round"/>
  <!-- Scheinwerfer -->
  <path d="M520 180c14 2 24 8 30 16" fill="none" stroke="#f2f6fa" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="540" cy="212" rx="10" ry="7" fill="none" stroke="#f2f6fa" stroke-width="4"/>
  <path d="M56 200h18" stroke="#c94b55" stroke-width="7" stroke-linecap="round"/>
  <!-- Räder -->
  <g>
    <circle cx="160" cy="240" r="46" fill="#0e1419"/>
    <circle cx="160" cy="240" r="30" fill="url(#rim)"/>
    <circle cx="160" cy="240" r="8" fill="#4b545c"/>
    <circle cx="470" cy="240" r="46" fill="#0e1419"/>
    <circle cx="470" cy="240" r="30" fill="url(#rim)"/>
    <circle cx="470" cy="240" r="8" fill="#4b545c"/>
  </g>
</svg>
